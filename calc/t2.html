<!doctype html><html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>T2 · Tempo</title><link rel="stylesheet" href="telas.css">
<style>.ex{color:#D4D5D8}
.btn:disabled{opacity:.3;pointer-events:none}  .atalhosH{display:flex;gap:6px;margin-top:11px;padding-top:11px;border-top:1px solid var(--linha);
    justify-content:space-between}
  .atalhosH button{flex:1;border:1.5px solid var(--linha);background:#fff;border-radius:9px;
    padding:9px 0;font-family:inherit;font-size:12.5px;font-weight:600;color:#55565B;cursor:pointer}
  .atalhosH button[aria-pressed=true]{background:var(--preto);border-color:var(--preto);color:#fff}
</style></head><body>
<div class="nav"><button class="volta">&#8249;</button><h2>Calculadora de Precificação</h2></div>
<div class="topo">
  <div class="passo">Pergunta 03 de 09</div>
  <h3>Quanto tempo leva<br>esse serviço?</h3>
  <p>Some tudo: lavagem, espera e escova. É esse tempo que decide quantas clientes cabem no seu dia.</p>
</div>
<div class="meio">
  <div class="dia">
    <div class="cab"><span>Seu dia · 9h às 19h</span><span id="cabem">—</span></div>
    <div class="trilhoDia" id="trilho"></div>
    <div class="leg">
      <span>Tempo do serviço</span>
      <div class="passoBox"><button id="m">−</button><b id="hv">3h</b><button id="p">+</button></div>
    </div>
    <div class="atalhosH" id="atalhosH"></div>
  </div>
</div>
<div class="saida">
  <div class="rot">Tempo do serviço</div>
  <div class="n"><span class="v" id="grande">3</span><span class="suf">h</span></div>
  <div class="conta" id="conta">—</div>
</div>
<div class="pe"><button class="btn">Continuar</button></div>
<script src="nucleo.js"></script>
<script src="estado.js"></script>
<script>
const EXPED=10;
let h = EST.horas != null ? +EST.horas : null;   /* ⚠️ nasce vazio */
const g=id=>document.getElementById(id);
const vir=v=>String(v).replace('.',',');
function pinta(){
  if(h==null){
    g('trilho').innerHTML='<div class="bloco sobra" style="flex:1">escolha o tempo aqui embaixo</div>';
    g('cabem').textContent='—';
    g('hv').innerHTML='<span class="ex">—</span>';
    g('grande').innerHTML='<span class="ex">—</span>';
    g('conta').textContent='Some lavagem, espera e escova';
    document.querySelector('.btn').disabled=true;
    salvar({horas:null}); return;
  }
  document.querySelector('.btn').disabled=false;
  g('atalhosH').querySelectorAll('button').forEach(x=>
    x.setAttribute('aria-pressed', +x.dataset.h===h));
  const n=Math.floor(EXPED/h), resto=EXPED-n*h;
  let s='';
  for(let i=0;i<n;i++) s+=`<div class="bloco" style="flex:${h}">${i+1}</div>`;
  if(resto>0.01) s+=`<div class="bloco sobra" style="flex:${resto}">${vir(+resto.toFixed(1))}h livre</div>`;
  g('trilho').innerHTML=s;
  g('cabem').textContent=n+(n===1?' cliente':' clientes');
  g('hv').textContent=vir(h)+'h';
  g('grande').textContent=vir(h);
  g('conta').textContent='Cabem '+n+(n===1?' cliente assim':' clientes assim')+' no seu dia';
  salvar({horas:h});
}
/* ⚠️ seis toques no + só para chegar em 3h. Os atalhos resolvem em um. */
g('atalhosH').innerHTML=[1,1.5,2,2.5,3,4].map(v=>
  `<button data-h="${v}">${String(v).replace('.',',')}h</button>`).join('');
g('atalhosH').onclick=e=>{const b=e.target.closest('button'); if(!b) return;
  h=+b.dataset.h; pinta();};

g('m').onclick=()=>{ if(h==null) return; h=+(h-.5).toFixed(1); if(h<.5) h=null; pinta(); };
g('p').onclick=()=>{ h = h==null ? .5 : Math.min(10,+(h+.5).toFixed(1)); pinta(); };
pinta();
</script><script src="nav.js"></script>
</body></html>
