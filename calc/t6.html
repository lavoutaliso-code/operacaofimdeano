<!doctype html><html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>T6 · Atendimentos</title><link rel="stylesheet" href="telas.css?v=34">
<style>.ex{color:#D4D5D8}
.btn:disabled{opacity:.3;pointer-events:none}</style></head><body>
<div class="nav"><button class="volta">&#8249;</button><h2>Calculadora de Precificação</h2></div>
<div class="topo">
  <div class="passo">Pergunta 09 de 10</div>
  <h3 id="pergunta">—</h3>
  <p id="ajuda">—</p>
</div>
<div class="meio">
  <div class="semana">
    <div id="dias"></div>
    <button class="todos" id="todos">Repetir esse número de terça a sábado</button>
    <div class="semFim"><span id="semRot">Na semana</span><b id="semTot">—</b></div>
  </div>
  <!-- ⛔ 02/11 — O MÊS COBRAVA PREÇO DE PROGRESSIVA EM TODO ATENDIMENTO.
       Esta tela pergunta o movimento do salão (todos os serviços) e o resultado
       multiplicava tudo pelo preço de UM. Medido num salão misto de 87/mês:
       R$ 21.750 projetados contra R$ 10.730 reais, 103% a mais. Aqui ela
       separa — e o rateio continua caindo sobre todos, porque o aluguel é
       pago por todos. -->
  <div class="recorte" id="recorte" hidden>
    <label for="sv" id="svRot">Desses, quantos são —?</label>
    <div class="svLinha">
      <button class="semB" id="svMenos" aria-label="menos">&minus;</button>
      <input id="sv" inputmode="numeric" aria-label="por semana">
      <button class="semB" id="svMais" aria-label="mais">+</button>
      <span class="svSuf">por semana</span>
    </div>
    <button class="todosServ" id="svTodos">São todos esse serviço</button>
  </div>
</div>
<div class="saida">
  <div class="rot" id="rotSaida">—</div>
  <div class="n"><span class="v" id="grande">—</span></div>
  <div class="conta" id="conta">—</div>
</div>
<div class="pe"><button class="btn">Continuar</button></div>
<script src="nucleo.js?v=34"></script>
<script src="estado.js?v=34"></script>
<script>
/* 4,33 semanas por mês — é a média real (52 semanas ÷ 12 meses). */
const SEMANAS = 4.33;
const NOMES = ['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'];
const DIAS = NOMES.map((nome,i)=>[nome, +(EST.semana[i]||0)]);
/* ⚠️ A PERGUNTA MUDA CONFORME A TELA 05. Com equipe, ninguém sabe dizer quanto
   cada profissional atende — ela sabe o movimento do SALÃO. A divisão é minha. */
const COM_EQUIPE = (+EST.pessoas || 0) > 0;
const BOCAS = (+EST.pessoas || 0) + 1;
const g = id => document.getElementById(id);

g('pergunta').innerHTML = COM_EQUIPE
  ? 'Quantos atendimentos<br>em média seu salão faz no dia?'
  : 'Quantos atendimentos<br>em média você faz no dia?';
g('ajuda').textContent = COM_EQUIPE
  ? 'O salão inteiro, somando todas as cadeiras. Deixe em zero o dia em que não abre.'
  : 'Dia por dia, numa semana comum. Deixe em zero o dia em que você não abre.';
g('semRot').textContent = COM_EQUIPE ? 'O salão na semana' : 'Você na semana';
g('rotSaida').textContent = COM_EQUIPE ? 'Cada uma atende, no mês' : 'Você atende, no mês';

/* Cada dia tem − e +, e o campo continua digitável para quem preferir escrever.
   O botão de repetir copia o número de terça a sábado num toque. */
g('dias').innerHTML = DIAS.map(([nome], k) => `
  <div class="semL${DIAS[k][1] ? ' on' : ''}" data-k="${k}">
    <span>${nome}</span>
    <div class="semCtl">
      <button class="semB menos" data-k="${k}" data-d="-1" aria-label="menos">&minus;</button>
      <input data-k="${k}" inputmode="numeric" value="${DIAS[k][1] || ''}"
             placeholder="${k === 0 ? '4' : ''}" aria-label="${nome}">
      <button class="semB mais" data-k="${k}" data-d="1" aria-label="mais">+</button>
    </div>
  </div>`).join('');

g('dias').addEventListener('click', ev => {
  const b = ev.target.closest('.semB'); if(!b) return;
  const k = +b.dataset.k;
  DIAS[k][1] = Math.max(0, Math.min(40, DIAS[k][1] + (+b.dataset.d)));
  const inp = g('dias').querySelector('input[data-k="'+k+'"]');
  inp.value = DIAS[k][1] || '';
  inp.closest('.semL').classList.toggle('on', DIAS[k][1] > 0);
  soma();
});

function reler(){
  g('dias').querySelectorAll('input').forEach(inp => {
    const k = +inp.dataset.k;
    DIAS[k][1] = Math.max(0, Math.min(40, parseInt(inp.value, 10) || 0));
    inp.closest('.semL').classList.toggle('on', DIAS[k][1] > 0);
  });
  soma();
}
g('dias').addEventListener('input', reler);

g('todos').onclick = () => {
  const base = DIAS.find(([, v]) => v > 0);
  const n = base ? base[1] : 0;
  if (!n) return;
  [1,2,3,4,5].forEach(k => DIAS[k][1] = n);
  g('dias').querySelectorAll('input').forEach(inp => {
    const k = +inp.dataset.k;
    inp.value = DIAS[k][1] || '';
    inp.closest('.semL').classList.toggle('on', DIAS[k][1] > 0);
  });
  soma();
};

/* quantos daquele serviço, por semana. null = ainda não respondeu */
const SERV = (EST.servico || 'esse serviço').toLowerCase();
let sv = EST.servicoSemana != null ? +EST.servicoSemana : null;
let svTodos = EST.servicoSemana === 0 ? false : EST.servicoSemana == null ? null : false;
g('svRot').textContent = 'Desses, quantos são ' + SERV + '?';

function pintaRecorte(sem){
  g('recorte').hidden = sem <= 0;
  if (sem <= 0) return;
  if (sv != null) sv = Math.max(0, Math.min(sem, sv));
  g('sv').value = sv != null ? sv : '';
  g('sv').placeholder = String(sem);
  g('svTodos').setAttribute('aria-pressed', sv === sem);
}
g('svMenos').onclick = () => { sv = Math.max(0, (sv == null ? 0 : sv) - 1); soma(); };
g('svMais').onclick  = () => { sv = (sv == null ? 0 : sv) + 1; soma(); };
g('sv').addEventListener('input', () => {
  const t = g('sv').value.trim();
  sv = t === '' ? null : Math.max(0, parseInt(t, 10) || 0);
  soma();
});
g('svTodos').onclick = () => { sv = DIAS.reduce((s, [, v]) => s + v, 0); soma(); };

function soma(){
  const sem = DIAS.reduce((s, [, v]) => s + v, 0);
  /* ⚠️ o botão exige as DUAS respostas: sem o recorte o mês volta a supor que
     todo atendimento do salão é este serviço. */
  document.querySelector('.btn').disabled = sem <= 0 || !(sv > 0);
  if (sv != null) sv = Math.max(0, Math.min(sem, sv));
  salvar({ semana: DIAS.map(([,v])=>v), servicoSemana: sv });
  pintaRecorte(sem);

  const mesSalao = Math.round(sem * SEMANAS);
  const porPessoa = Math.round(mesSalao / BOCAS);
  const mesServico = sv > 0 ? Math.min(Math.round(sv * SEMANAS), mesSalao) : null;
  const abertos = DIAS.filter(([, v]) => v > 0).length;
  g('semTot').textContent = sem > 0 ? sem : '—';
  g('grande').innerHTML = sem > 0 ? porPessoa : '<span class="ex">—</span>';
  if(sem <= 0){ g('conta').textContent = 'Escreva quantas clientes você atende em cada dia'; return; }
  if(!(sv > 0)){
    g('conta').textContent = 'Agora diga quantos desses ' + mesSalao + ' são ' + SERV;
    return;
  }
  g('conta').textContent = mesSalao + ' no mês'
    + (COM_EQUIPE ? ' ÷ ' + BOCAS + ' pessoas' : '')
    + ' · ' + mesServico + ' são ' + SERV
    + ' · ' + abertos + (abertos === 1 ? ' dia aberto' : ' dias abertos');
}
soma();
</script><script src="nav.js?v=34"></script>
</body></html>
