<!doctype html><html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>T6 · Atendimentos</title><link rel="stylesheet" href="telas.css">
<style>.ex{color:#D4D5D8}
.btn:disabled{opacity:.3;pointer-events:none}</style></head><body>
<div class="nav"><button class="volta">&#8249;</button><h2>Calculadora de Precificação</h2></div>
<div class="topo">
  <div class="passo">Pergunta 08 de 09</div>
  <h3 id="pergunta">—</h3>
  <p id="ajuda">—</p>
</div>
<div class="meio">
  <div class="semana">
    <div id="dias"></div>
    <button class="todos" id="todos">Repetir esse número de terça a sábado</button>
    <div class="semFim"><span id="semRot">Na semana</span><b id="semTot">—</b></div>
  </div>
</div>
<div class="saida">
  <div class="rot" id="rotSaida">—</div>
  <div class="n"><span class="v" id="grande">—</span></div>
  <div class="conta" id="conta">—</div>
</div>
<div class="pe"><button class="btn">Continuar</button></div>
<script src="nucleo.js"></script>
<script src="estado.js"></script>
<script>
/* 4,33 semanas por mês — é a média real (52 semanas ÷ 12 meses). */
const SEMANAS = 4.33;
const NOMES = ['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'];
const DIAS = NOMES.map((nome,i)=>[nome, +(EST.semana[i]||0)]);
/* ⚠️ A PERGUNTA MUDA CONFORME A TELA 05. Com equipe, ninguém sabe dizer quanto
   cada profissional atende — ela sabe o movimento do SALÃO. A divisão é minha. */
const COM_EQUIPE = (+EST.pessoas || 0) > 0;
const BOCAS = (+EST.pessoas || 0) + 1;
const g = id => document.getElementById(id);

g('pergunta').innerHTML = COM_EQUIPE
  ? 'Quantos atendimentos<br>em média seu salão faz no dia?'
  : 'Quantos atendimentos<br>em média você faz no dia?';
g('ajuda').textContent = COM_EQUIPE
  ? 'O salão inteiro, somando todas as cadeiras. Deixe em zero o dia em que não abre.'
  : 'Dia por dia, numa semana comum. Deixe em zero o dia em que você não abre.';
g('semRot').textContent = COM_EQUIPE ? 'O salão na semana' : 'Você na semana';
g('rotSaida').textContent = COM_EQUIPE ? 'Cada uma atende, no mês' : 'Você atende, no mês';

/* Cada dia tem − e +, e o campo continua digitável para quem preferir escrever.
   O botão de repetir copia o número de terça a sábado num toque. */
g('dias').innerHTML = DIAS.map(([nome], k) => `
  <div class="semL${DIAS[k][1] ? ' on' : ''}" data-k="${k}">
    <span>${nome}</span>
    <div class="semCtl">
      <button class="semB menos" data-k="${k}" data-d="-1" aria-label="menos">&minus;</button>
      <input data-k="${k}" inputmode="numeric" value="${DIAS[k][1] || ''}"
             placeholder="" aria-label="${nome}">
      <button class="semB mais" data-k="${k}" data-d="1" aria-label="mais">+</button>
    </div>
  </div>`).join('');

g('dias').addEventListener('click', ev => {
  const b = ev.target.closest('.semB'); if(!b) return;
  const k = +b.dataset.k;
  DIAS[k][1] = Math.max(0, Math.min(40, DIAS[k][1] + (+b.dataset.d)));
  const inp = g('dias').querySelector('input[data-k="'+k+'"]');
  inp.value = DIAS[k][1] || '';
  inp.closest('.semL').classList.toggle('on', DIAS[k][1] > 0);
  soma();
});

function reler(){
  g('dias').querySelectorAll('input').forEach(inp => {
    const k = +inp.dataset.k;
    DIAS[k][1] = Math.max(0, Math.min(40, parseInt(inp.value, 10) || 0));
    inp.closest('.semL').classList.toggle('on', DIAS[k][1] > 0);
  });
  soma();
}
g('dias').addEventListener('input', reler);

g('todos').onclick = () => {
  const base = DIAS.find(([, v]) => v > 0);
  const n = base ? base[1] : 0;
  if (!n) return;
  [1,2,3,4,5].forEach(k => DIAS[k][1] = n);
  g('dias').querySelectorAll('input').forEach(inp => {
    const k = +inp.dataset.k;
    inp.value = DIAS[k][1] || '';
    inp.closest('.semL').classList.toggle('on', DIAS[k][1] > 0);
  });
  soma();
};

function soma(){
  const sem = DIAS.reduce((s, [, v]) => s + v, 0);
  document.querySelector('.btn').disabled = sem <= 0;
  salvar({ semana: DIAS.map(([,v])=>v) });
  const mesSalao = Math.round(sem * SEMANAS);
  const porPessoa = Math.round(mesSalao / BOCAS);
  const abertos = DIAS.filter(([, v]) => v > 0).length;
  g('semTot').textContent = sem > 0 ? sem : '—';
  g('grande').innerHTML = sem > 0 ? porPessoa : '<span class="ex">—</span>';
  if(sem <= 0){ g('conta').textContent = 'Escreva quantas clientes você atende em cada dia'; return; }
  g('conta').textContent = COM_EQUIPE
    ? mesSalao + ' no salão ÷ ' + BOCAS + ' pessoas · ' + abertos
      + (abertos === 1 ? ' dia aberto' : ' dias abertos')
    : sem + ' por semana × 4,33 semanas · ' + abertos
      + (abertos === 1 ? ' dia aberto' : ' dias abertos');
}
soma();
</script><script src="nav.js"></script>
</body></html>
