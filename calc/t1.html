<!doctype html><html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>T1 · Preço</title><link rel="stylesheet" href="telas.css">
<style>
  /* ⚠️ o teclado já ocupa o pé da tela; com margin-top:auto na pergunta ela
     descia 202px à toa. Aqui a pergunta fica no alto e a etiqueta se centra
     no vão que sobra entre ela e o teclado. */
  .topo{margin-top:0;padding-top:14px}
  .meio{margin-top:auto;margin-bottom:auto;padding-top:0}
  .tag .pv .ex{color:#D4D5D8}
  .tag .pv .cursor{display:inline-block;width:3px;height:44px;background:var(--preto);
                   margin-left:4px;border-radius:2px;animation:pisca 1.05s step-end infinite;
                   align-self:center}
  @keyframes pisca{0%,100%{opacity:1}50%{opacity:0}}
  .btn:disabled{opacity:.3;pointer-events:none}
</style></head><body>
<div class="nav"><button class="volta">&#8249;</button><h2>Calculadora de Precificação</h2></div>
<div class="topo">
  <div class="passo">Pergunta 02 de 09</div>
  <h3>Quanto você cobra<br>por esse serviço?</h3>
  <p>O preço que está na sua tabela hoje — não o que você gostaria de cobrar.</p>
</div>
<div class="meio">
  <div class="tagWrap">
    <div class="barbante"></div>
    <div class="tag">
      <div class="et" id="etq">—</div>
      <div class="pv"><span class="c">R$</span><span class="d" id="pv">250</span></div>
    </div>
  </div>
</div>
<div class="teclado" id="tec" style="padding:0 16px"></div>
<div class="pe"><button class="btn">Continuar</button></div>
<script src="nucleo.js"></script>
<script src="estado.js"></script>
<script>
let buf = EST.preco != null ? String(EST.preco).replace('.', ',') : '';
const mil=t=>{const[a,b]=String(t).split(',');return a.replace(/\B(?=(\d{3})+(?!\d))/g,'.')+(b!==undefined?','+b:'');};
const g=id=>document.getElementById(id);
salvar({});
if(g('etq')) g('etq').textContent = EST.servico;
g('tec').innerHTML=['1','2','3','4','5','6','7','8','9',',','0','⌫'].map(t=>`<button data-t="${t}">${t}</button>`).join('');
pinta();
g('tec').onclick=e=>{const b=e.target.closest('button');if(!b)return;const t=b.dataset.t;
  if(t==='⌫')buf=buf.slice(0,-1);
  else if(t===','){if(!buf.includes(','))buf+=buf?',':'0,';}
  else buf=(buf==='0'?'':buf)+t;
  pinta();};
function pinta(){
  /* ⚠️ vazio mostra o exemplo em cinza com um cursor piscando — nunca um zero,
     que a pessoa podia tomar por resposta dada. */
  g('pv').innerHTML = buf
    ? mil(buf) + '<i class="cursor"></i>'
    : '<i class="cursor"></i>';
  g('pv').classList.toggle('vazio', !buf);
  document.querySelector('.btn').disabled = !buf;
  salvar({ preco: buf ? parseFloat(buf.replace(',', '.')) : null });}
</script><script src="nav.js"></script>
</body></html>
