<!doctype html><html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>T0 · Procedimento</title><link rel="stylesheet" href="telas.css">
<style>
  /* ⚠️ esta tela não tem instrumento alto: centralizar na tela inteira deixava
     a pergunta a 324px do topo. Aqui o conteúdo começa logo abaixo da barra. */
  .topo{margin-top:0;padding-top:16px}
  .meio{margin-bottom:auto;padding-top:26px}
</style></head><body>
<div class="nav"><button class="volta">&#8249;</button><h2>Calculadora de Precificação</h2></div>
<div class="topo">
  <div class="passo">Pergunta 01 de 09</div>
  <h3>Qual procedimento<br>você quer calcular?</h3>
  <p>Um por vez. Comece pelo que você mais faz; depois você calcula os outros.</p>
</div>
<div class="meio">
  <div class="nomeBox">
    <div class="campoNome">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
      <input id="nome" placeholder="escreva aqui" autofocus>
    </div>
    <div class="sugest" id="sug"></div>
    <p class="dicaNome" id="dica">—</p>
  </div>
</div>
<div class="pe"><button class="btn">Continuar</button></div>
<script src="nucleo.js"></script>
<script src="estado.js"></script>
<script>
const OPCOES=['Progressiva','Botox','Mechas','Corte','Escova','Hidratação','Coloração','Luzes'];
const g=id=>document.getElementById(id);
g('nome').value = EST.servico || '';
function pinta(){
  const v=g('nome').value.trim();
  g('sug').innerHTML=OPCOES.map(o=>
    `<button aria-pressed="${o.toLowerCase()===v.toLowerCase()}">${o}</button>`).join('');
  g('sug').querySelectorAll('button').forEach(b=>{
    b.onclick=()=>{ g('nome').value=b.textContent; salvar({servico:b.textContent}); pinta(); };
  });
  g('dica').textContent = v
    ? 'Vamos descobrir quanto sobra pra você em cada ' + v.toLowerCase() + '.'
    : 'Escreva o nome ou toque num dos atalhos aqui embaixo.';
  document.querySelector('.btn').disabled = !v;
}
salvar({});
g('nome').addEventListener('input',()=>{ salvar({servico:g('nome').value.trim()||'Procedimento'}); pinta(); });
pinta();
</script><script src="nav.js"></script>
</body></html>
