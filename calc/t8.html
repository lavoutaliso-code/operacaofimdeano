<!doctype html><html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>T8 · Profissionais</title><link rel="stylesheet" href="telas.css"></head><body>
<div class="nav"><button class="volta">&#8249;</button><h2>Calculadora de Precificação</h2></div>
<div class="topo">
  <div class="passo">Pergunta 05 de 09</div>
  <h3>Quantas profissionais<br>trabalham com você?</h3>
  <p>Toque no <b>+</b> para cada profissional que trabalha com você hoje. Se trabalha sozinha, diga que é só você.</p>
</div>
<div class="meio">
  <div class="salao">
    <div class="cadeiras" id="cadeiras"></div>
    <button class="semEquipe" id="so">Sou só eu, não tenho equipe</button>
  </div>
</div>
<div class="saida">
  <div class="rot">Profissionais além de você</div>
  <div class="n"><span class="v" id="grande">—</span></div>
  <div class="conta" id="conta">—</div>
</div>
<div class="pe"><button class="btn">Continuar</button></div>
<script src="nucleo.js"></script>
<script src="estado.js"></script>
<script>
/* ⚠️ `qtd` nasce NULL: zero profissional é resposta, e resposta é dela.
   Ou ela toca no + , ou declara «sou só eu». Nada vem escolhido. */
let qtd = EST.pessoas != null && EST.respondeuPessoas ? +EST.pessoas : null;
const CAD=`<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3"
  stroke-linecap="round" stroke-linejoin="round">
  <rect x="15" y="6" width="18" height="19" rx="5"/>
  <path d="M10 25h28a3 3 0 0 1 3 3v2a3 3 0 0 1-3 3H10a3 3 0 0 1-3-3v-2a3 3 0 0 1 3-3z"/>
  <path d="M24 33v7"/><path d="M15 44h18"/></svg>`;
const MAIS=`<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3"
  stroke-linecap="round"><path d="M24 14v20"/><path d="M14 24h20"/></svg>`;
const g=id=>document.getElementById(id);
function pinta(){
  let h=`<button class="cad voce">${CAD}<span>você</span></button>`;
  for(let k=1;k<=(qtd||0);k++) h+=`<button class="cad on" data-k="${k}">${CAD}<span>prof. ${k}</span></button>`;
  h+=`<button class="cad mais" id="add">${MAIS}<span>somar</span></button>`;
  g('cadeiras').innerHTML=h;
  g('add').onclick=()=>{qtd=Math.min(8,(qtd||0)+1);pinta();};
  g('cadeiras').querySelectorAll('.cad.on').forEach(b=>b.onclick=()=>{qtd=Math.max(0,qtd-1);pinta();});
  g('so').hidden = qtd > 0;
  document.querySelector('.btn').disabled = qtd == null;
  g('grande').innerHTML = qtd == null ? '<span class="ex">—</span>' : qtd;
  salvar({ pessoas: qtd || 0, respondeuPessoas: qtd != null });
  g('conta').textContent = qtd == null
    ? 'Toque no + para cada profissional, ou diga que é só você'
    : qtd === 0
      ? 'Só você atendendo, no seu aluguel'
      : 'Vocês '+(qtd+1)+' atendendo ao mesmo tempo, no mesmo aluguel';
}
g('so').onclick = () => { qtd = 0; pinta(); };
pinta();
</script><script src="nav.js"></script>
</body></html>
